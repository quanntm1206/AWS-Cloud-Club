terms:
- term: dataset
  meaning: A collection of samples used for analysis or model training.
  example: A churn file has 300 customers, with columns describing each customer.
  introduced_in: 0
- term: reproducibility
  meaning: The ability to rerun the same data, code, and settings and get comparable
    results.
  example: Two terminals use the same seed and produce the same row count and metric
    within tolerance.
  introduced_in: 0
- term: sample
  meaning: One observation in a dataset, usually one row or one image.
  example: One customer is a sample in the churn table.
  introduced_in: 0
- term: schema
  meaning: A description of input column names, data types, and valid rules.
  example: The tenure column must be non-negative; churn accepts only 0 or 1.
  introduced_in: 0
- term: seed
  meaning: A starting number for random generation so splits or initialization can
    be repeated.
  example: Set seed 42 before creating demo data.
  introduced_in: 0
- term: feature
  meaning: Input information the model uses to make a prediction.
  example: Tenure and monthly_charges are two features in the churn problem.
  introduced_in: 1
- term: label / target
  meaning: The outcome to predict, used to train or evaluate a model.
  example: Churn=1 is the label for a customer who left.
  introduced_in: 1
- term: parameter
  meaning: A value the model learns from data during training.
  example: The weights in the linear-regression vector w are parameters.
  introduced_in: 1
- term: vectorization
  meaning: Computing on a whole array instead of looping through elements in Python.
  example: Use X @ w to calculate scores for every sample.
  introduced_in: 1
- term: data validation
  meaning: Checking that data follows the schema and quality rules before use.
  example: Find duplicate IDs, negative ages, or a missing target.
  introduced_in: 2
- term: EDA
  meaning: Exploring data with statistics and plots to understand quality, distributions,
    and follow-up questions.
  example: Compare the overall churn rate with the rate for each contract group.
  introduced_in: 2
- term: missing value
  meaning: A value that is absent or not recorded in the dataset.
  example: Some samples have no monthly_charges value.
  introduced_in: 2
- term: outlier
  meaning: An observation far from most of the data; investigate it before deleting
    or changing it.
  example: An unusually high bill may be an error or a real business customer.
  introduced_in: 2
- term: gradient
  meaning: The direction and size showing how loss changes when a parameter changes.
  example: A positive gradient suggests lowering the parameter by the learning rate.
  introduced_in: 3
- term: learning rate
  meaning: The size of each parameter update.
  example: A learning rate that is too large makes loss oscillate or grow.
  introduced_in: 3
- term: loss
  meaning: The number a model tries to reduce during training to measure error on
    learning data.
  example: MSE penalizes the squared distance between prediction and target.
  introduced_in: 3
- term: prediction
  meaning: The value a model produces for one sample.
  example: The model predicts monthly_charges of 42.5.
  introduced_in: 3
- term: baseline
  meaning: A simple benchmark to know whether a complex model really improves or not.
  example: Dummy classifier always guesses popular classes.
  introduced_in: 4
- term: confusion matrix
  meaning: Truth and prediction counting table to see which class the model confuses
    with which class.
  example: The row churn=1 indicates how many samples were predicted to be 0.
  introduced_in: 4
- term: data split
  meaning: How to divide a dataset into parts with different and non-overlapping roles.
  example: Divide 70% training, 15% validation, 15% testing.
  introduced_in: 4
- term: fit
  meaning: The step of learning parameters or transform states from training data.
  example: Call pipeline.fit(X_train, y_train).
  introduced_in: 4
- term: metric
  meaning: Number that measures an aspect of quality; Must choose according to goals
    and error costs.
  example: Recall measures the rate at which customer churn is found.
  introduced_in: 4
- term: model validation
  meaning: The process of testing the model on data that has not yet been used to
    fit to evaluate and choose a decision.
  example: So F1 on the validation set before opening the test.
  introduced_in: 4
- term: precision / recall / F1
  meaning: Precision focuses on correct positive predictions, recall focuses on finding
    enough positive samples, and F1 balances both sides.
  example: Churn posts prioritize recall but still track precision.
  introduced_in: 4
- term: test set
  meaning: The data section is only opened after the decision has been locked to estimate
    the final result.
  example: Run the test once after selecting logistic regression.
  introduced_in: 4
- term: training set
  meaning: The data part is used for the model to learn parameters.
  example: Logistic regression calls fit only with the training set.
  introduced_in: 4
- term: validation set
  meaning: The data part is used to select model, threshold or hyperparameter; Do
    not use fit parameter.
  example: Choose a threshold with satisfactory recall on the validation set.
  introduced_in: 4
- term: data leakage
  meaning: Invalid information from validation, testing, or futures enters training.
  example: Fit scaler on the entire dataset before splitting to leak test information.
  introduced_in: 5
- term: pipeline
  meaning: Preprocessing and modeling chains run in a fixed order to reduce errors
    and leakage.
  example: ColumnTransformer connects logistic regression in a Pipeline.
  introduced_in: 5
- term: preprocessing
  meaning: Steps to prepare data before the model such as missing fill, scale or encode.
  example: Fill in the median and then one-hot encode the contract column.
  introduced_in: 5
- term: transform
  meaning: Input transformation; Some transforms must learn states only from the training
    set.
  example: StandardScaler learns mean and std from training and applies it to validation.
  introduced_in: 5
- term: class imbalance
  meaning: There is a large difference in the number of samples between classes.
  example: Only 8% of customers churn so accuracy is easily misleading.
  introduced_in: 6
- term: threshold
  meaning: Threshold converts scores or probabilities into decision labels.
  example: Probabilities of 0.35 or higher are labeled churn.
  introduced_in: 6
- term: bias / variance
  meaning: High bias is often due to the model being too simple; high variance because
    the model is too sensitive to training data.
  example: The learning curve has both low training and validation suggesting a high
    bias.
  introduced_in: 7
- term: cross-validation
  meaning: Evaluate iteratively over many folds to estimate the model's stability.
  example: 3-fold CV generates three validation scores.
  introduced_in: 7
- term: fold
  meaning: Part of the data in turn does validation in cross-validation.
  example: In fold 2, the second group is kept for evaluation.
  introduced_in: 7
- term: overfitting
  meaning: The model remembers training data but performs poorly on new data.
  example: Train score increases and validation score decreases.
  introduced_in: 7
- term: bagging / boosting
  meaning: Bagging learns multiple models relatively independently; Boosting learns
    sequentially to correct errors first.
  example: Random forest uses bagging, gradient boosting uses boosting.
  introduced_in: 8
- term: ensemble
  meaning: The model combines multiple sub-models to create a common prediction.
  example: Random forest takes results from many decision trees.
  introduced_in: 8
- term: hyperparameter
  meaning: The configuration is chosen by the user, not a self-learning parameter
    model.
  example: Number of trees and maximum depth of random forest.
  introduced_in: 8
- term: ablation
  meaning: Experiment with adding or removing exactly one ingredient to measure its
    impact.
  example: Remove the behavioral feature group and then compare AUC validation.
  introduced_in: 9
- term: feature engineering
  meaning: Create or transform features based on problem understanding and prediction
    times.
  example: Create tenure_bucket from tenure if used during inference.
  introduced_in: 9
- term: error analysis
  meaning: Systematic analysis of incorrect predictions to create hypotheses and further
    testing.
  example: View false negative by contract type.
  introduced_in: 10
- term: failure taxonomy
  meaning: How to group errors according to observable causes instead of gathering
    all common errors.
  example: Attach errors to data, boundary, missing signal or label noise.
  introduced_in: 10
- term: slice
  meaning: Groups of samples with common characteristics are separated to test model
    behavior.
  example: New customer slices have a tenure of less than three months.
  introduced_in: 10
- term: support
  meaning: The actual sample number of a class or slice used to read contextual metrics.
  example: 100% recall on support=2 is not enough for a strong conclusion.
  introduced_in: 10
- term: artifact
  meaning: Model, config, metric and metadata files needed to reproduce or serve predictions.
  example: model.joblib and manifest.json make up the artifact.
  introduced_in: 11
- term: inference
  meaning: Use the trained model to create predictions for new input.
  example: Load the artifact and then predict an unseen guest.
  introduced_in: 11
- term: manifest
  meaning: The list describes the content, version, checksum and artifact origin.
  example: Manifest records seed, feature order and SHA-256.
  introduced_in: 11
- term: configuration
  meaning: "The values \u200B\u200Bthat control a run, are saved separately for reruns\
    \ and comparisons."
  example: Config YAML records seed, feature and threshold.
  introduced_in: 12
- term: package
  meaning: Python code is organized into modules that can be imported, tested, and
    called from the CLI.
  example: Put the training logic in src/ml_roadmap instead of copying it between
    notebooks.
  introduced_in: 12
- term: data contract
  meaning: Machine-readable conventions for data schema, scope, and errors.
  example: Missing tenure column must be rejected before model.
  introduced_in: 13
- term: parity
  meaning: A level of consistency between two runs is expected for the same input.
  example: Prediction before and after save/load must match within tolerance.
  introduced_in: 13
- term: API contract
  meaning: Clear conventions on input, output, status code and errors of the inference
    service.
  example: Payload missing tenure returns 422 instead of 500.
  introduced_in: 14
- term: latency
  meaning: Time from receiving request to returning response.
  example: Measure warm latency for mini batch of 16 samples.
  introduced_in: 14
- term: CI
  meaning: The process automatically runs validation and testing when code changes.
  example: A CI pipeline that runs pytest, Ruff, and mypy without deploying AWS.
  introduced_in: 15
- term: container
  meaning: Application packages with dependencies and configurations run in a separate
    environment.
  example: Docker images run APIs using non-root users.
  introduced_in: 15
- term: batch
  meaning: The sample group is processed at once before updating the parameter.
  example: Batch size 32 means the model reads 32 images per step.
  introduced_in: 16
- term: device
  meaning: Hardware where tensors and models perform calculations.
  example: Model and input are on the same cpu or cuda.
  introduced_in: 16
- term: epoch
  meaning: One pass of the model goes through the entire training set.
  example: Three epochs means each sample train is used about three times.
  introduced_in: 16
- term: optimizer
  meaning: The algorithm uses gradients to update parameters.
  example: Adam updates the classifier head after loss.backward().
  introduced_in: 16
- term: tensor
  meaning: Multidimensional arrays are used to represent data and calculations in
    neural networks.
  example: Batch images with shape [32, 3, 160, 160].
  introduced_in: 16
- term: augmentation
  meaning: Make appropriate random changes on the training sample to increase diversity
    without changing labels.
  example: Flip the train image horizontally; validation only resize deterministic.
  introduced_in: 17
- term: backbone
  meaning: The main network part extracts features before the classifier head.
  example: ResNet18 pretrained as backbone.
  introduced_in: 17
- term: checkpoint
  meaning: The training state is saved so it can be continued after the runtime is
    interrupted.
  example: Last checkpoint contains model, optimizer, epoch and history.
  introduced_in: 17
- term: freeze
  meaning: Temporarily do not update parameters of part of the model during training.
  example: Set requires_grad=False for backbone.
  introduced_in: 17
- term: transfer learning
  meaning: Reuse knowledge from pretrained models for new problems.
  example: Keep the ResNet18 backbone and replace the classifier head.
  introduced_in: 17
- term: early stopping
  meaning: Stop training when validation does not improve past the specified number
    of epochs.
  example: Stopping after two epochs of validation loss is not better.
  introduced_in: 18
- term: fine-tuning
  meaning: Continue training part of the pretrained model with a small learning rate
    for the new problem.
  example: Unfreeze layer4 after frozen-head baseline.
  introduced_in: 18
- term: macro average
  meaning: How to calculate the metric by giving each class equal weight, even if
    the number of samples is different.
  example: Macro F1 average F1 of churn and non-churn as two equal classes.
  introduced_in: 19
- term: weighted average
  meaning: How to calculate the metric by giving a class more samples a larger weight
    according to support.
  example: Weighted F1 can look high when common classes do well but rare classes
    do poorly.
  introduced_in: 19
- term: budget alert
  meaning: Alerts when actual or forecast costs hit thresholds; not hard cap.
  example: Actual and Forecasted Budget email alerts.
  introduced_in: 20
- term: CloudWatch Logs
  meaning: Where to store runtime logs on AWS; Need to avoid sensitive data and set
    retention.
  example: Log group Lambda keeps one day.
  introduced_in: 20
- term: IAM
  meaning: AWS services manage identity and access according to the principle of least
    permissions.
  example: Lambda roles can only read the correct object model in S3.
  introduced_in: 20
- term: idempotent cleanup
  meaning: The cleanup process can be run again safely and still aim for a clean state.
  example: Cleanup exact project ID then scan again.
  introduced_in: 20
- term: Lambda
  meaning: The service runs serverless functions on request without managing the server.
  example: Call private invoke to run tabular inference.
  introduced_in: 20
- term: residual scan
  meaning: Check step after cleanup to find remaining project resources.
  example: Scan CloudFormation, S3, Lambda, Logs and IAM.
  introduced_in: 20
- term: S3
  meaning: AWS object storage service is used to store small artifacts.
  example: Upload portable_model.json to private bucket.
  introduced_in: 20
