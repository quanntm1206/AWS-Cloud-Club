scale:
  emerging: {label: Unstable, factor: 0.4, description: Unable to create proper contract output or need to redo core part.}
  developing: {label: In progress, factor: 0.7, description: "Works but evidence, testing or reproducibility is lacking."}
  proficient: {label: Satisfactory, factor: 1.0, description: "Correct, reproducible, with evaluation and decision explanation."}
  outstanding: {label: Exceeds expectations, factor: 1.1, description: "Has deep error analysis, clear trade-offs and a controlled improvement."}

milestones:
  - id: milestone-01
    weeks: 4
    focus: Data and math foundation
    pass_score: 70
    criteria: {Understand the data and set the problem: 30, Calculate correctly and check the results: 30, Recreate the environment: 25, Explain the limits: 15}
  - id: milestone-02
    weeks: 8
    focus: Reliable model reviews
    pass_score: 70
    criteria: {Dividing data and preventing leakage: 30, Choosing metrics according to the problem: 30, Cross-validation and stability: 25, Conclusion with evidence: 15}
  - id: milestone-03
    weeks: 12
    focus: Complete tabular project
    pass_score: 70
    criteria: {Pipeline and data contract: 30, Baseline and controlled experiments: 25, Error analysis: 25, Replication and communication: 20}
  - id: milestone-04
    weeks: 16
    focus: ML engineering
    pass_score: 70
    criteria: {Package structure and CLI: 25, Test and contract inference: 30, CI and artifact versioning: 25, Operations and limitations: 20}
  - id: milestone-05
    weeks: 20
    focus: Computer Vision saves compute
    pass_score: 70
    criteria: {Transfer learning correct: 25, Checkpoint and resume: 25, Evaluation per-class: 30, Failure analysis and limits: 20}
  - id: milestone-06
    weeks: 24
    focus: Capstone and cost safety
    pass_score: 75
    criteria: {End-to-end integration: 25, Testing and reproducibility: 25, AWS cost safety and cleanup: 30, Demo and retrospective: 20}

global_gates:
  - no_data_leakage
  - no_secrets
  - reproducible_mini_run
  - aws_cleanup_evidence_when_applicable