name: curriculum-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python scripts/validate_curriculum.py
      - run: python scripts/validate_learner_docs.py
      - run: python scripts/validate_sources.py
      - run: python scripts/validate_notebooks.py
      - run: python scripts/validate_aws_safety.py
      - run: python scripts/run-unit-tests.py
      - run: python -m ruff check .
      - run: python -m mypy
      - name: Assert CI has no AWS deployment
        run: python scripts/validate_ci_safety.py
      - name: Build country revenue image
        run: docker build -t country-revenue-api:test .
      - name: Smoke test country and aggregate predictions
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name country-revenue-api -p 8000:8000 country-revenue-api:test
          trap 'docker rm -f country-revenue-api >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health | grep -q '"status":"ready"'; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs country-revenue-api
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent -X POST http://127.0.0.1:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"country":"france","date":"2018-09-15"}' | grep -q '"status":"success"'
          curl --fail --silent -X POST http://127.0.0.1:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"country":"all","date":"2018-09-15"}' | grep -q '"status":"success"'
